version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-taskmanager
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=gemini-3.7-flash
      - DATABASE_URL=sqlite+aiosqlite:///./tasks.db
    volumes:
      - task_data:/app/data
    restart: unless-stopped

volumes:
  task_data:
