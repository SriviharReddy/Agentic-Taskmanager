[project]
name = "agentic-taskmanager"
version = "2.0.0"
description = "Agentic Task Manager: AI-Native Multimodal Task Intelligence and Autonomous Copilot powered by LangGraph and Gemini 3.7 Flash."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "langgraph>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-google-genai>=4.0.0",
    "google-genai>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pillow>=10.4.0",
    "trafilatura>=1.12.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests", "backend/evals"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:langchain_core.*:",
    "ignore::UserWarning:langsmith.*:"
]
